# Normal (non-secret) settings for the API
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-api-config
data:
  PORT: "5000"
  JWT_EXPIRES_IN: "1d"
  MONGO_URI: "mongodb://mongodb:27017/taskmanager"   # "mongodb" = the Service name above
---
# The API (2 pods)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-api
  labels:
    app: task-manager-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-manager-api
  template:
    metadata:
      labels:
        app: task-manager-api
    spec:
      containers:
        - name: api
          # The tag is set in kustomization.yaml (CI will update it automatically in Step 8)
          image: ghcr.io/pshelar498-dotcom/task-manager-api
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: task-manager-api-config
            - secretRef:
                name: task-manager-api-secrets      # created by hand, never stored in Git
          # Restart the pod if the app stops responding
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          # Send traffic only when MongoDB is connected
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
# Access from your PC: http://localhost:30500
apiVersion: v1
kind: Service
metadata:
  name: task-manager-api
spec:
  type: NodePort
  selector:
    app: task-manager-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500