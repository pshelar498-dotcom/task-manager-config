apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Put everything in the "staging" namespace
namespace: staging

resources:
  - namespace.yaml
  - mongodb.yaml
  - api.yaml
  - ui.yaml

# WHICH version of each app runs in staging (CI updates these lines)
images:
  - name: ghcr.io/pshelar498-dotcom/task-manager-api
    newTag: sha-2ceaf26
  - name: ghcr.io/pshelar498-dotcom/task-manager-ui
    newTag: sha-3d018df