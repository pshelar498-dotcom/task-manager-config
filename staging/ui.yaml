# ---------- Deployment: runs the UI (nginx serving the React app) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-ui
  labels:
    app: task-manager-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-manager-ui
  template:
    metadata:
      labels:
        app: task-manager-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/pshelar498-dotcom/task-manager-ui   # the tag comes from kustomization.yaml
          ports:
            - containerPort: 8080
          env:
            # nginx forwards /api/... here (the API Service name inside the cluster)
            - name: API_URL
              value: "http://task-manager-api:5000"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# ---------- Service: opens the UI on http://localhost:30080 ----------
apiVersion: v1
kind: Service
metadata:
  name: task-manager-ui
spec:
  type: NodePort
  selector:
    app: task-manager-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080